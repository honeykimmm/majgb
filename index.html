<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DYB 동탄1 추석 리뷰 퀴즈</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1a2e; --card: #16213e; --accent: #e94560;
  --red: #e21b3c; --blue: #1368ce; --yellow: #c9920a; --green: #26890c;
  --text: #fff; --muted: #aaa; --correct: #2ecc71; --wrong: #e74c3c;
}
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100dvh; overflow-x: hidden; }
#app { min-height: 100dvh; display: flex; flex-direction: column; }

/* LOBBY */
.lobby { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:18px; }
.logo { font-size:clamp(1.6rem,5vw,2.2rem); font-weight:900; text-align:center; line-height:1.15; }
.logo .accent { color:var(--accent); }
.logo small { display:block; font-size:0.85rem; font-weight:400; color:var(--muted); margin-top:6px; }
.card { background:var(--card); border-radius:16px; padding:20px 28px; width:100%; max-width:420px; }
.join-form { display:flex; flex-direction:column; gap:12px; width:100%; max-width:420px; }
.join-form input { padding:16px 20px; font-size:1.2rem; border-radius:12px; border:2px solid #444; background:var(--card); color:var(--text); text-align:center; outline:none; transition:border-color .2s; }
.join-form input:focus { border-color:var(--accent); }
.btn { padding:15px 28px; border-radius:12px; border:none; font-size:1.05rem; font-weight:700; cursor:pointer; transition:transform .1s, filter .15s; width:100%; }
.btn:active { transform:scale(.97); }
.btn-go   { background:var(--accent); color:#fff; font-size:1.2rem; }
.btn-next { background:var(--accent); color:#fff; }
.btn-start{ background:#2ecc71; color:#000; font-size:1.25rem; padding:18px; }
.btn-reset{ background:#555; color:#fff; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.chip-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.chip { background:var(--card); border-radius:20px; padding:7px 14px; font-size:0.88rem; }
.status { color:var(--muted); font-size:0.9rem; text-align:center; }
.spinner { width:44px; height:44px; border:4px solid #333; border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* QUESTION */
.q-wrap { flex:1; display:flex; flex-direction:column; min-height:100dvh; }
.q-head { background:var(--card); padding:10px 18px; display:flex; align-items:center; gap:12px; }
.q-meta { flex:1; overflow:hidden; }
.q-cat  { font-size:0.72rem; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.q-num  { font-size:0.88rem; font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tcircle { width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.1rem; flex-shrink:0; }
.q-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 16px; gap:18px; }
.q-text { font-size:clamp(1rem,3vw,1.45rem); font-weight:700; text-align:center; max-width:680px; line-height:1.45; white-space:pre-wrap; }
.opts   { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:680px; }
.opt    { padding:clamp(13px,3vw,20px) 14px; border-radius:13px; border:none; cursor:pointer; font-size:clamp(0.9rem,2.4vw,1.15rem); font-weight:700; color:#fff; text-align:left; display:flex; align-items:center; gap:10px; transition:transform .1s, filter .15s; min-height:68px; line-height:1.3; }
.opt:active { transform:scale(.97); }
.opt.selected { box-shadow:0 0 0 4px rgba(255,255,255,.6); filter:brightness(1.25); }
.opt.answered { cursor:not-allowed; }
.opt.correct  { animation:pop .4s ease; box-shadow:0 0 0 4px #fff; }
.opt.wrong    { filter:brightness(.45); }
@keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.07)} 100%{transform:scale(1)} }
.opt-icon { font-size:1.45rem; flex-shrink:0; }
.opt-a { background:var(--red); }
.opt-b { background:var(--blue); }
.opt-c { background:var(--yellow); }
.opt-d { background:var(--green); }
.host-bar { position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,.85); backdrop-filter:blur(6px); padding:14px 20px; display:flex; flex-direction:column; gap:8px; align-items:center; }
.host-info { font-size:0.85rem; color:var(--muted); }

/* REVEAL */
.reveal-wrap { flex:1; display:flex; flex-direction:column; align-items:center; padding:24px 16px; gap:14px; }
.big-icon { font-size:4.5rem; animation:pop .45s ease; }
.feedback-msg { font-size:1.75rem; font-weight:900; text-align:center; }
.correct-box { background:rgba(46,204,113,.15); border:2px solid var(--correct); border-radius:13px; padding:12px 22px; text-align:center; max-width:560px; width:100%; }
.pts-badge { font-size:1.3rem; color:#ffd700; font-weight:900; }
.bars { width:100%; max-width:560px; display:flex; flex-direction:column; gap:7px; }
.bar-row { display:flex; align-items:center; gap:8px; }
.bar-lbl { width:26px; font-size:.85rem; text-align:center; }
.bar-track { flex:1; background:#333; border-radius:6px; height:26px; overflow:hidden; }
.bar-fill  { height:100%; border-radius:6px; transition:width .5s ease; display:flex; align-items:center; padding:0 8px; font-size:0.78rem; font-weight:700; min-width:0; }
.bar-cnt { width:28px; font-size:.82rem; text-align:right; }

/* LEADERBOARD */
.lb-wrap { flex:1; display:flex; flex-direction:column; align-items:center; padding:24px 16px; gap:10px; }
.lb-title { font-size:1.8rem; font-weight:900; color:#ffd700; }
.lb-list  { width:100%; max-width:480px; display:flex; flex-direction:column; gap:7px; }
.lb-row   { background:var(--card); border-radius:12px; padding:12px 18px; display:flex; align-items:center; gap:12px; animation:slideIn .3s ease both; }
@keyframes slideIn { from { transform:translateX(-18px); opacity:0; } }
.lb-rank { font-size:1.35rem; font-weight:900; width:34px; text-align:center; }
.lb-name { flex:1; font-weight:600; }
.lb-score{ font-weight:900; color:#ffd700; }
.lb-row.r1 { background:linear-gradient(135deg,#b8860b,#ffd700); color:#000; }
.lb-row.r1 .lb-score { color:#000; }
.lb-row.r2 { background:linear-gradient(135deg,#555,#aaa); }
.lb-row.r3 { background:linear-gradient(135deg,#6b3b1a,#cd7f32); }

/* DONE */
.done-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:16px; }
.emoji-big { font-size:2.8rem; display:flex; gap:6px; }
.final-score { font-size:2rem; font-weight:900; }
.final-acc   { color:var(--muted); font-size:0.95rem; }

/* UTIL */
.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
.br { background:#4a0e8f; }
.bv { background:#0e4a8f; }
.bg { background:#0e8f4a; }
</style>
</head>
<body>
<div id="app"><div class="lobby"><div class="spinner"></div><p style="color:var(--muted)">연결 중...</p></div></div>

<script>

const firebaseConfig = {
  apiKey: "PASTE_HERE",

let localStart = 0;        // 이 기기에서 현재 문제를 받은 시각 (기기 시계 차이 방지)

let timerIv   = null;

const app = document.getElementById("app");

// ─────────────────── INIT ────────────────────
function init() {
  if (firebaseConfig.apiKey==="PASTE_HERE") {
    app.innerHTML = `<div class="lobby"><div class="logo">⚙️ 설정 필요</div>
      <div class="status">파일 위쪽 firebaseConfig에 Firebase 설정값을 붙여넣어 주세요.</div></div>`;
    return;
  }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  stateRef   = db.collection("quiz_state").doc(ROOM);
  playersCol = db.collection("quiz_players");

  let playersUnsub = null;
  stateRef.onSnapshot(snap => {
    const d = snap.data() || { phase:"lobby", currentQ:0, session:"s0", startTime:0 };
    const sessionChanged = d.session !== gs.session;
    const changed = sessionChanged || d.phase !== gs.phase || d.currentQ !== gs.currentQ;
    if (d.phase==="question" && (changed)) localStart = Date.now();
    if (sessionChanged) {
      // 새 게임 → 내 점수 초기화, 참가자 구독 다시
      if (gs.session) { myAnswers=[]; myScore=0; }
      gs.session = d.session;
      if (playersUnsub) playersUnsub();
      playersUnsub = playersCol.where("session","==",d.session).onSnapshot(qs => {
        peers = {};
        qs.forEach(doc => { const p = doc.data(); if (p.name) peers[p.id] = p; });
        if (gs.phase==="lobby") renderLobby();
        else if (gs.phase==="reveal" || gs.phase==="lb" || gs.phase==="done") onPhaseChange();
        else if (gs.phase==="question" && isHost) updateHostCount();
      });
      if (myName && !isHost) sendPresence();
    }
    gs = { phase:d.phase, currentQ:d.currentQ, session:d.session, startTime:d.startTime||0 };
    if (changed) onPhaseChange();
  }, err => {
    app.innerHTML = `<div class="lobby"><div class="logo">⚠️ 연결 오류</div><div class="status">${esc(err.message)}</div></div>`;
  });
}

function setState(phase, currentQ, newSession) {
  const data = { phase, currentQ, session: newSession || gs.session || "s0", startTime: Date.now() };
  stateRef.set(data).catch(e=>alert("저장 실패: "+e.message));
}

function sendPresence() {
  if (!playersCol || !myName || isHost || !gs.session) return;
  const qi = gs.currentQ;
  const a = myAnswers[qi];
  playersCol.doc(gs.session+"_"+myId).set({
    id:myId, name:myName, score:myScore, session:gs.session,
    lastA: a ? { qi, a:a.a, correct:a.correct, pts:a.pts } : null
  }).catch(()=>{});
}

function onPhaseChange() {
  clearInterval(timerIv);
  const p = gs.phase;
  if      (p==="lobby")    renderLobby();
  else if (p==="question") renderQuestion();
  else if (p==="reveal")   renderReveal();
  else if (p==="lb")       renderLB();
  else if (p==="done")     renderDone();
}

function hStart()      { setState("question", 0); }
function hNewSession() { setState("lobby", 0, "s"+Date.now().toString(36)); }

// ─────────────── QUESTION ────────────────────
function updateHostCount() {
  const el = document.getElementById("hcount");
  if (!el) return;
  const qi = gs.currentQ;
  el.textContent = `답변 ${Object.values(peers).filter(p=>p.lastA?.qi===qi).length}/${Object.values(peers).length}명 완료`;
}

function renderQuestion() {
  const qi = gs.currentQ;
  const q  = QS[qi];
  if (!q) return;
  const myA = myAnswers[qi];
  const tl  = timeLeft();
  const pct = Math.max(0, tl / q.t * 100).toFixed(1);
  const tc  = tl > q.t*.5 ? "#00d2d3" : tl > q.t*.25 ? "#ffd700" : "#e94560";
  const ans = myA !== undefined ? myA : null;
  const canAnswer = !isHost && myName;

  app.innerHTML = `
    <div class="q-wrap">
      <div class="q-head">
        <div class="q-meta">
          <div class="q-cat"><span class="badge ${badgeCls(q.cat)}">${q.cat}</span></div>
          <div class="q-num">Q${qi+1}/${QS.length} · ${esc(q.unit)}</div>
        </div>
        <div class="tcircle" id="tc" style="background:conic-gradient(${tc} ${pct}%,#333 0)">
          <span id="tn">${Math.ceil(tl)}</span>
        </div>
      </div>
      <div class="q-body" style="${isHost?"padding-bottom:120px":""}">
        <div class="q-text">${esc(q.q)}</div>
        ${!canAnswer && !isHost ? `<div class="status">이름을 입력하지 않아 구경 모드예요</div>` : ""}
        ${q.type==="input" ? (isHost ? `<div class="status">✏️ 서술형 — 학생들이 답을 입력하는 중</div>` : `
        <div style="width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;align-items:center">
          ${ans!==null && ans.a!==null ? `
            <div style="background:var(--card);border-radius:13px;padding:16px 24px;text-align:center;width:100%">
              <div style="font-size:.8rem;color:var(--muted);margin-bottom:6px">내 답변</div>
              <div style="font-size:1.4rem;font-weight:900;color:#ffd700">${esc(String(ans.a))}</div>
            </div>
            <button class="btn btn-reset" style="max-width:200px;font-size:.95rem" onclick="editInput()">✏️ 수정하기</button>
            <div style="color:var(--muted);font-size:.85rem">정답 공개 전까지 수정 가능</div>
          ` : `
            <input id="inp" type="text" placeholder="정답을 영어로 입력하세요" autocomplete="off" autocapitalize="off"
              style="padding:16px 20px;font-size:1.2rem;border-radius:12px;border:2px solid #444;background:var(--card);color:var(--text);text-align:center;outline:none;width:100%"
              onkeydown="if(event.key==='Enter')submitInput()">
            <button class="btn btn-go" style="max-width:240px" onclick="submitInput()">제출하기 ✏️</button>
          `}
        </div>`) : `
        <div class="opts">
          ${q.o.map((opt,i)=>`
            <button class="opt ${COLS[i]}${ans!==null&&ans.a===i?" selected":""}" ${isHost?"style='cursor:default'":`onclick="pick(${i})"`}>
              <span class="opt-icon">${SHAPES[i]}</span>
              <span>${esc(opt)}</span>
            </button>`).join("")}
        </div>
        ${ans!==null&&typeof ans.a==="number"?`<div class="status">✅ <strong>${SHAPES[ans.a]} ${esc(q.o[ans.a])}</strong> 선택 · 변경하려면 다른 버튼을 누르세요</div>`:""}`}
      </div>
      ${isHost?`

          <button class="btn btn-next" onclick="hReveal()">정답 공개 →</button>
        </div>`:""}
    </div>`;
  updateHostCount();
  startTimer(qi, q);
}

function startTimer(qi, q) {
  clearInterval(timerIv);
  timerIv = setInterval(()=>{
    const tl = timeLeft();
    const pct = Math.max(0, tl / q.t * 100).toFixed(1);
    const tc  = tl > q.t*.5 ? "#00d2d3" : tl > q.t*.25 ? "#ffd700" : "#e94560";
    const el = document.getElementById("tc");
    const num= document.getElementById("tn");
    if (el) el.style.background = `conic-gradient(${tc} ${pct}%,#333 0)`;
    if (num) num.textContent = Math.max(0,Math.ceil(tl));
    if (tl<=0) {
      clearInterval(timerIv);
      if (isHost) hReveal();
      else {
        // 시간 종료 → 입력 잠금
        document.querySelectorAll(".opt").forEach(b=>b.onclick=null);
        const inp=document.getElementById("inp"); if(inp) inp.disabled=true;
      }
    }
  }, 200);
}

function timeLeft() {
  const q = QS[gs.currentQ];
  if (!q) return 0;
  return Math.max(0, (localStart + q.t*1000 - Date.now())/1000);
}

function pick(i) {
  const qi = gs.currentQ;
  if (gs.phase!=="question" || isHost || !myName || timeLeft()<=0) return;
  const q = QS[qi];
  const tl = timeLeft();
  const prev = myAnswers[qi];
  if (prev && prev.a === i) return;
  if (prev) myScore -= (prev.pts||0);
  const correct = i===q.a;
  const pts = correct ? Math.round(500+500*(tl/q.t)) : 0;
  myAnswers[qi] = { a:i, tl, correct, pts };
  myScore += pts;
  sendPresence();
  renderQuestion();
}

function submitInput() {
  const qi = gs.currentQ;
  if (gs.phase!=="question" || isHost || !myName || timeLeft()<=0) return;
  const q = QS[qi];
  const val = (document.getElementById("inp")?.value||"").trim().toLowerCase().replace(/\s+/g," ");
  if (!val) { const el=document.getElementById("inp"); if(el){el.style.borderColor="var(--accent)";el.focus();} return; }
  const tl = timeLeft();
  const accepted = (Array.isArray(q.a) ? q.a : [q.a]).map(x=>x.toLowerCase());
  const correct = accepted.includes(val);
  const pts = correct ? Math.round(500+500*(tl/q.t)) : 0;
  const prev = myAnswers[qi];
  if (prev) myScore -= (prev.pts||0);
  myAnswers[qi] = { a:val, tl, correct, pts };
  myScore += pts;
  sendPresence();
  renderQuestion();
}

function editInput() {
  const qi = gs.currentQ;
  if (gs.phase!=="question" || timeLeft()<=0) return;
  const prev = myAnswers[qi];
  if (prev) myScore -= (prev.pts||0);
  delete myAnswers[qi];
  sendPresence();
  renderQuestion();
  setTimeout(()=>document.getElementById("inp")?.focus(),50);
}

function hReveal() { clearInterval(timerIv); if (gs.phase==="question") setState("reveal", gs.currentQ); }

// ─────────────── REVEAL ──────────────────────
function renderReveal() {
  const qi = gs.currentQ;
  const q  = QS[qi];
  const myA = myAnswers[qi];
  const correct = myA?.correct;
  const pts = myA?.pts || 0;
  const isInput = q.type === "input";
  const correctAns = isInput ? (Array.isArray(q.a)?q.a[0]:q.a) : q.o[q.a];
  const plist = Object.values(peers);

  const correctBox = `
    <div class="correct-box">
      <div style="font-size:.75rem;color:var(--muted);margin-bottom:4px">정답</div>
      <strong style="font-size:1.15rem;color:var(--correct)">${isInput?"✏️ ":""}${esc(correctAns)}</strong>
      ${isInput&&Array.isArray(q.a)&&q.a.length>1?`<div style="font-size:.8rem;color:var(--muted);margin-top:4px">또는: ${q.a.slice(1).map(esc).join(", ")}</div>`:""}
    </div>`;

  let bars = "";
  if (!isInput) {
    const cnts = [0,0,0,0];
    plist.forEach(p => { if (p.lastA?.qi===qi && typeof p.lastA?.a==="number") cnts[p.lastA.a]++; });
    const tot = cnts.reduce((s,c)=>s+c,0)||1;
    bars = `<div class="bars">` + q.o.map((opt,i)=>`
      <div class="bar-row">
        <div class="bar-lbl">${SHAPES[i]}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${cnts[i]/tot*100}%;background:var(--${CLRS[i]})">${cnts[i]>0?cnts[i]+"명":""}</div>
        </div>
        <div class="bar-cnt" style="${i===q.a?"color:#2ecc71;font-weight:900":""}">${i===q.a?"✓":""}</div>
      </div>`).join("") + `</div>`;
  } else {
    const answered = plist.filter(p=>p.lastA?.qi===qi);
    const ok = answered.filter(p=>p.lastA?.correct);
    bars = answered.length ? `<div class="bars">
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:6px">정답자 (${ok.length}/${answered.length}명)</div>
      <div class="chip-row">${ok.map(p=>`<div class="chip" style="background:#1a4a2e;color:#2ecc71">✅ ${esc(p.name)}</div>`).join("") || '<span style="color:var(--muted)">없음</span>'}</div>
    </div>` : "";
  }

  if (isHost) {
    const okN = plist.filter(p=>p.lastA?.qi===qi&&p.lastA?.correct).length;
    const showLB = (qi+1)%5===0 && qi+1<QS.length;
    app.innerHTML = `
      <div class="reveal-wrap" style="padding-bottom:120px">
        <div style="font-size:1.3rem;font-weight:900">Q${qi+1} 정답 공개</div>
        <div class="q-text" style="font-size:1rem;color:var(--muted)">${esc(q.q)}</div>
        ${correctBox}
        ${bars}
        <div style="font-size:.82rem;color:var(--muted)">정답률 ${plist.length?Math.round(okN/plist.length*100):0}%</div>
      </div>
      <div class="host-bar">
        ${qi+1<QS.length
          ? (showLB ? `<button class="btn btn-next" onclick="hLB()">🏆 중간 순위 보기</button>` : `<button class="btn btn-next" onclick="hNext()">다음 문제 → Q${qi+2}</button>`)
          : `<button class="btn btn-next" style="background:#2ecc71;color:#000" onclick="hLB()">🏆 최종 순위 보기</button>`}
      </div>`;
  } else {
    app.innerHTML = `
      <div class="reveal-wrap">
        <div class="big-icon">${myName?(correct?"🎉":"😢"):"🎯"}</div>
        ${myName?`<div class="feedback-msg" style="color:${correct?"var(--correct)":"var(--wrong)"}">${correct?"정답! 🔥":(myA&&myA.a!==null?"틀렸어요":"시간 초과")}</div>`:""}
        ${correctBox}
        ${myName&&correct?`<div class="pts-badge">+${pts}점</div>`:""}
        ${myName?`<div style="color:var(--muted);font-size:.9rem">총점: ${myScore.toLocaleString()}점</div>`:""}
        ${bars}
        <div class="status" style="margin-top:8px">다음 문제를 기다리세요...</div>
      </div>`;
  }
}

function hNext() { setState("question", gs.currentQ+1); }
function hLB()   { setState("lb", gs.currentQ); }
function hDone() { setState("done", gs.currentQ); }
function hReset(){ setState("lobby", 0, "s"+Date.now().toString(36)); }

// ─────────────── LEADERBOARD ─────────────────
function lbRows(delay) {
  return [...Object.values(peers)].sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,10).map((p,i)=>`
    <div class="lb-row ${i===0?"r1":i===1?"r2":i===2?"r3":""}" style="animation-delay:${i*delay}s">
      <div class="lb-rank">${MEDALS[i]||i+1}</div>
      <div class="lb-name">${p.id===myId?"✨ ":""}${esc(p.name)}</div>
      <div class="lb-score">${(p.score||0).toLocaleString()}점</div>
    </div>`).join("");
}
function myRank() {
  const s = [...Object.values(peers)].sort((a,b)=>(b.score||0)-(a.score||0));
  const i = s.findIndex(p=>p.id===myId);
  return i>=0 ? `${i+1}위 / ${s.length}명` : "";
}

function renderLB() {
  const isLast = gs.currentQ >= QS.length-1;
  app.innerHTML = `
    <div class="lb-wrap">
      <div class="lb-title">🏆 순위표</div>
      <div style="color:var(--muted);font-size:.88rem">${isLast?"최종 결과!":"Q"+(gs.currentQ+1)+" 완료"}</div>
      ${!isHost&&myName?`<div style="font-weight:700">내 순위: ${myRank()} · ${myScore.toLocaleString()}점</div>`:""}
      <div class="lb-list">${lbRows(.09)||'<div class="status">아직 데이터가 없어요</div>'}</div>
      ${isHost?`
        <div style="margin-top:8px">
          ${!isLast
            ?`<button class="btn btn-next" style="width:auto;padding:14px 28px" onclick="hNext()">계속하기 → Q${gs.currentQ+2}</button>`
            :`<button class="btn btn-next" style="width:auto;padding:14px 28px;background:#2ecc71;color:#000" onclick="hDone()">🎊 게임 종료</button>`}
        </div>`
        :`<div class="status">선생님을 기다리세요...</div>`}
    </div>`;
}

// ─────────────── DONE ────────────────────────
function renderDone() {
  const ok = myAnswers.filter(a=>a&&a.correct).length;
  app.innerHTML = `
    <div class="done-wrap">
      <div class="emoji-big">🎊 🏆 🎉</div>
      <div style="font-size:2rem;font-weight:900">퀴즈 종료!</div>
      ${myName&&!isHost?`
        <div style="text-align:center">
          <div class="final-score">${myScore.toLocaleString()}점</div>
          <div class="final-acc">${ok} / ${QS.length} 정답 (${Math.round(ok/QS.length*100)}%) · ${myRank()}</div>
        </div>`:""}
      <div class="lb-list">${lbRows(.08)}</div>
      ${isHost?`<button class="btn btn-reset" style="width:auto;padding:14px 28px;margin-top:8px" onclick="hReset()">🔄 새 게임</button>`:""}
    </div>`;
}

// ─────────────── UTILS ───────────────────────
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function badgeCls(cat) {
  if (cat.includes("Reading")) return "br";
  if (cat.includes("Vocab"))   return "bv";
  return "bg";
}

init();
</script>
</body>
</html>
